import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    // 不带版本号：AGP 已随 :app 进入构建脚本 classpath，再声明版本会被 Gradle 判为版本冲突
    id 'com.android.test'
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.androidx.baselineprofile)
}

// 与 :app 的本机组共用的 applicationId 后缀（单一真源在 gradle.properties）。
// 宏基准运行在 :app 的 nonMinifiedRelease / benchmarkRelease 上，这两个变体属于本机组、
// 带后缀，所以这里拼出的目标包名也必须带上，否则 UiAutomator 启动不了目标进程。
def devAppIdSuffix = providers.gradleProperty('offermateDevAppIdSuffix').getOrElse('.dev')

android {
    namespace 'com.jk.offermate.baselineprofile'
    compileSdk 35

    defaultConfig {
        // BaselineProfileRule 需要 API 28+；非 root 设备实际要求 API 33+（见 README 里的生成命令说明）
        minSdk 28
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 被测应用包名。base 部分与 :app 的 applicationId 保持一致（改那边记得改这里），
        // 后缀部分从 gradle.properties 读，跟着本机组自动走。
        buildConfigField "String", "TARGET_PACKAGE", "\"com.jk.offermate${devAppIdSuffix}\""
    }

    buildFeatures {
        // AGP 8 默认关闭；TARGET_PACKAGE 要靠它传给测试代码
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 被测应用
    targetProjectPath = ':app'

    // 自我插桩：宏基准需要测试进程与被测应用进程分离
    experimentalProperties["android.experimental.self-instrumenting"] = true
}

// 只在这一个 flavor/build type 上生成，避免重复跑
baselineProfile {
    useConnectedDevices = true
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.junit
    implementation libs.androidx.test.runner
    implementation libs.androidx.test.uiautomator
    implementation libs.androidx.benchmark.macro.junit4
}
