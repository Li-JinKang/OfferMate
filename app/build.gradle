import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    // Kotlin 2.0+ 启用 Compose 需要 Compose 编译器插件
    alias(libs.plugins.compose.compiler)
    // Room 等注解处理器
    alias(libs.plugins.ksp)
    // Baseline Profile：把 :baselineprofile 采集的 profile 合入 release 包
    alias(libs.plugins.androidx.baselineprofile)
}

// 发布签名配置：从项目根目录 keystore.properties 读取（该文件不入库，见 .gitignore）。
// 本地没有该文件时（如 CI 未配置、或仅需 debug 构建）不会报错，release 签名相关配置会被跳过，
// 此时 assembleRelease 产出未签名包。
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 开发期 API Key 自动回填：从 local.properties 读 devApiKey，只注入 debug 包的 BuildConfig。
// 动机是 API Key 存在 EncryptedSharedPreferences 里，主密钥在 Android Keystore 按 app UID 归属，
// 随卸载删除——它是唯一"备份脚本也带不回来"的配置（见 tools/dev-backup.sh 的说明）。
// 与其每次重装手动粘贴，不如让 debug 包启动时发现 Key 为空就自己填上。
//
// 安全性：local.properties 已在 .gitignore 里，不会入库；release 变体拿到的是空串
// （默认值在 defaultConfig 里给），所以正式包不含任何 Key。
def localPropertiesFile = rootProject.file('local.properties')
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def devApiKey = localProperties.getProperty('devApiKey', '')
def devApiProvider = localProperties.getProperty('devApiProvider', '')

// buildConfigField 的值是直接拼进 Java 源码的字面量，必须自己转义反斜杠与引号
def bcString = { String raw ->
    '"' + (raw ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// 本机开发/测量包共用的 applicationId 后缀，定义在 gradle.properties（:baselineprofile 也读它）
def devAppIdSuffix = providers.gradleProperty('offermateDevAppIdSuffix').getOrElse('.dev')

// 正式包的 applicationId（唯一定义处，defaultConfig 与下面的 variant 覆盖都用它）
def baseApplicationId = 'com.jk.offermate'

// 「本机组」= 只会装在开发者自己设备上的构建类型。详见下方 buildTypes 里的长注释。
// 放在脚本顶层是因为 android {} 与 androidComponents {} 两个块都要用到它。
def localDevBuildTypes = ['debug', 'nonMinifiedRelease', 'benchmarkRelease', 'profileable']

android {
    namespace 'com.jk.offermate'
    compileSdk 35

    defaultConfig {
        applicationId baseApplicationId
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 默认空：只有 debug 变体会被覆盖成真实值，release 因此天然不含 Key，
        // 运行时逻辑也不需要靠 BuildConfig.DEBUG 判断（空串即"不回填"）。
        buildConfigField "String", "DEV_API_KEY", bcString('')
        buildConfigField "String", "DEV_API_PROVIDER", bcString('')
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8：开启代码混淆/优化 + 资源压缩，缩小包体
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 调试构建保持不混淆，便于定位问题
            minifyEnabled false
            shrinkResources false
            // 开发期 Key 自动回填（值来自 local.properties，不入库）
            buildConfigField "String", "DEV_API_KEY", bcString(devApiKey)
            buildConfigField "String", "DEV_API_PROVIDER", bcString(devApiProvider)
        }
        // 性能剖析专用：与 release **完全同构**（R8 + 资源压缩 + 基线 profile + 不可调试），
        // 只多一个 <profileable android:shell="true"/>（见 src/profileable/AndroidManifest.xml），
        // 让 Android Studio Profiler / Perfetto / simpleperf 能附加到进程。
        //
        // 为什么不用 debuggable：debuggable=true 会关掉一部分 ART 优化、改变 JIT 行为，
        // 测出来的帧耗时比真实 release 差一截，结论不可用。profileable 不影响运行时性能。
        //
        // 与插件派生的 benchmarkRelease 的区别：那个归 baselineprofile 插件管（供宏基准用），
        // 这个是自己的、意图明确的剖析包，不随基准工具链变动。
        profileable {
            initWith release
            // initWith 会连 release 的签名一起复制过来，这里显式覆盖（下面的 configureEach 也会兜一遍）
            matchingFallbacks = ['release']
        }
    }

    // ---- 本机组 vs 正式包：签名与 applicationId 的统一约定 ----
    //
    // 「本机组」= 只会装在开发者自己设备上的包：debug（日常开发）、profileable（性能剖析）、
    // nonMinifiedRelease / benchmarkRelease（baselineprofile 插件派生，用于采 profile 和跑宏基准）。
    // 这一组统一做两件事：**同一个 debug 签名** + **同一个 applicationId 后缀**。
    //
    // 为什么要同签名：
    // 1. 没有 keystore.properties 时 release 未签名，派生的测量变体根本装不上设备；
    // 2. 有正式签名时，它们与设备上已装的 debug 开发包签名冲突
    //    （INSTALL_FAILED_UPDATE_INCOMPATIBLE），只能先卸载。
    //
    // 为什么要同后缀，而且必须**整组**一起加：
    // 后缀把本机组与正式 release 分成设备上并存的两个应用，从此互不覆盖，
    // 再也不会因为"装过正式包又切回 debug"被迫卸载（卸载会清掉题库、简历记忆、API Key，
    // 其中 API Key 连备份脚本都救不回来——主密钥在 Android Keystore 里随卸载删除）。
    // 但后缀只给 debug 是错的：测量变体要和 debug 开发包**共享数据目录**，
    // 因为采 profile 依赖设备上真实的对话/题库数据（见 BaselineProfileGenerator 的注释）。
    // 只给 debug 加后缀会把测量变体隔离成另一个空数据的应用，正好废掉它的用途。
    //
    // 正式 release 不在这一组：无后缀、用正式签名，行为完全不变
    // （无 keystore.properties 时仍产出未签名包）。它与本机组的签名"冲突"因此不再存在，
    // 两者是不同的 applicationId。
    //
    // 后缀值定义在 gradle.properties 的 offermateDevAppIdSuffix，:baselineprofile 也读同一个值。
    // 新增构建类型时，判断它属于哪一组，属于本机组就加进脚本顶部的 localDevBuildTypes。
    //
    // 这里只管签名；applicationId 的后缀在文件末尾的 androidComponents.onVariants 里设，
    // 原因见那段注释（buildType.applicationIdSuffix 会被 baselineprofile 插件覆盖）。
    buildTypes.configureEach { bt ->
        if (bt.name in localDevBuildTypes) {
            // 对 debug 是 no-op（它本来就是 debug 签名），统一写在这里是为了让"整组同签名"只有一处约定
            bt.signingConfig = signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        // AGP 8 默认关闭 BuildConfig 生成；开发期 Key 回填与 applicationId 断言都要用它
        buildConfig true
    }

    testOptions {
        unitTests {
            // 让 JVM 单测里的 android.util.Log 调用返回默认值而不是抛
            // "not mocked"，网络层（data/net）用 Logcat 打阶段日志，需要它才能被单测覆盖。
            returnDefaultValues = true
        }
    }
}

// baselineprofile 插件会为**每个**非 debug 构建类型再派生一对 benchmarkXxx / nonMinifiedXxx 变体。
// profileable 只是给人用 Profiler 附加的本机剖析包，不参与基线 profile 的生成与宏基准，
// 派生出来的那两个纯属噪音（会挤在 Build Variants 下拉里）。这里直接禁用。
androidComponents {
    beforeVariants(selector().withBuildType('benchmarkProfileable')) { it.enable = false }
    beforeVariants(selector().withBuildType('nonMinifiedProfileable')) { it.enable = false }

    // 本机组统一加 applicationId 后缀（与正式 release 在设备上并存，互不覆盖）。
    //
    // 为什么不能只靠 buildTypes 里的 applicationIdSuffix：
    // baselineprofile 插件会在更后面用 variant API 把它派生的 nonMinifiedRelease /
    // benchmarkRelease 的 applicationId 设回被测应用的值，把 buildType 上的后缀盖掉。
    // 实测过：configureEach 里设的 `.dev` 在 buildType 属性上确实生效了，
    // 但这两个变体的 merged manifest 里 package 仍是无后缀的 com.jk.offermate。
    // variant API 是最终权威，且我们的回调注册晚于插件，所以在这里设才压得住。
    //
    // 必须连派生变体一起加，不能只给 debug/profileable：
    // 采 baseline profile 依赖设备上真实的对话与题库数据（见 BaselineProfileGenerator 注释），
    // 派生变体若用独立包名就是一个空数据的新应用，profile 覆盖不到 Markdown 渲染热路径。
    onVariants(selector().all()) { variant ->
        if (localDevBuildTypes.contains(variant.buildType)) {
            variant.applicationId.set(baseApplicationId + devAppIdSuffix)
        }
    }
}

// 使用 AGP 内置 Kotlin 的扩展配置 JVM 目标
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    // Compose (P4 UI)
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.navigation.compose
    debugImplementation libs.androidx.compose.ui.tooling

    // Content reading (P2)
    implementation libs.jsoup
    implementation libs.readability4j
    implementation libs.okhttp
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.serialization.json

    // 本地存储 (P3)
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    implementation libs.androidx.datastore.preferences
    implementation libs.androidx.security.crypto

    // 后台任务 (P4)
    implementation libs.androidx.work.runtime.ktx

    // 网络 / DeepSeek (P5)
    implementation libs.retrofit
    implementation libs.retrofit.kotlinx.serialization

    // 图片加载
    implementation libs.coil.compose

    // 简历解析（PDF）
    implementation libs.pdfbox.android

    // 端侧 OCR：ML Kit 中文文字识别（bundled，含拉丁字母/数字，适配中英混排面经）
    implementation libs.mlkit.text.recognition.chinese

    // Markdown 渲染（mikepenz，纯 Compose + Material3，需 Compose 1.8+；代码块用自定义 CodeCard）
    implementation libs.markdown.renderer
    implementation libs.markdown.renderer.m3

    // Baseline Profile：运行时把打进包里的 profile 交给 ART；生成侧在 :baselineprofile 模块
    implementation libs.androidx.profileinstaller
    baselineProfile project(':baselineprofile')

    testImplementation libs.junit
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}

// 让单元测试里的 println 输出可见（用于 LiveLinkReadingTest 的人工校验）
tasks.withType(Test).configureEach {
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}