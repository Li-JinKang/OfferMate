    // 端侧 OCR：ML Kit 中文文字识别（bundled，含拉丁字母/数字，适配中英混排面经）
    implementation libs.mlkit.text.recognition.chinese

    // Markdown 渲染（mikepenz，纯 Compose + Material3，需 Compose 1.8+；代码块用自定义 CodeCard）
