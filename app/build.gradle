import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    // Kotlin 2.0+ 启用 Compose 需要 Compose 编译器插件
    alias(libs.plugins.compose.compiler)
    // Room 等注解处理器
    alias(libs.plugins.ksp)
}

// 发布签名配置：从项目根目录 keystore.properties 读取（该文件不入库，见 .gitignore）。
// 本地没有该文件时（如 CI 未配置、或仅需 debug 构建）不会报错，release 签名相关配置会被跳过，
// 此时 assembleRelease 产出未签名包。
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.jk.offermate'
    compileSdk 35

    defaultConfig {
        applicationId "com.jk.offermate"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8：开启代码混淆/优化 + 资源压缩，缩小包体
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 调试构建保持不混淆，便于定位问题
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }
}

// 使用 AGP 内置 Kotlin 的扩展配置 JVM 目标
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    // Compose (P4 UI)
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.navigation.compose
    debugImplementation libs.androidx.compose.ui.tooling

    // Content reading (P2)
    implementation libs.jsoup
    implementation libs.readability4j
    implementation libs.okhttp
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.serialization.json

    // 本地存储 (P3)
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    implementation libs.androidx.datastore.preferences
    implementation libs.androidx.security.crypto

    // 后台任务 (P4)
    implementation libs.androidx.work.runtime.ktx

    // 网络 / DeepSeek (P5)
    implementation libs.retrofit
    implementation libs.retrofit.kotlinx.serialization

    // 图片加载
    implementation libs.coil.compose

    // 简历解析（PDF）
